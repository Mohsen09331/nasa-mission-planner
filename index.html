</head>
<body>
    <h1>NASA Mission Planner</h1>

    <form>
        <label>Mission Name:</label>
        <input type="text">
<label>Mission Destination:</label>
<select>
    <option>Moon</option>
    <option>Mars</option>
    <option>International Space Station</option>
</select>
        <label>Mission Duration:</label>

    </form>
   <h2>Mission Summary</h2>
<div>
    <p>Mission Name: Not selected</p>

    <p>Duration: Not selected</p>
</div>
</body>
